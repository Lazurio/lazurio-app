# Trial builds only (desktop-update-trial.yml, docs/adr/0005 point 9): the app's own configuration
# with its update feed on the loopback, where trial/serve-feed.ps1 or a local server serves N+1.
# A released build never carries this feed.
extends: ./electron-builder.yml
publish:
  - provider: generic
    url: http://127.0.0.1:47123/
