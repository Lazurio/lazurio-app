# Lazurio App GEN4. The identity io.lazurio.app never changes (decisions 0241 and 0248): macOS
# keeps the person's Accessibility and Screen Recording permissions with it and its signing team.
appId: io.lazurio.app
productName: Lazurio App
# The package's name, which names the per-user Windows installation folder
# (%LOCALAPPDATA%\Programs\lazurio-app) and the updater's cache. It never changes after the first
# release, since every update installs into the same folder.
extraMetadata:
  name: lazurio-app
copyright: Copyright © 2026 Lazurio
directories:
  output: release
files:
  - dist-electron/**
  - dist-ui/**
  - package.json
asar: true
extraResources:
  - from: ../../helpers/tailnet/bin
    to: helpers
    filter:
      - lazurio-tailnet
      - lazurio-tailnet.exe
  - from: ../../helpers/device/target/release
    to: helpers
    filter:
      - lazurio-device
      - lazurio-device.exe
# Read back from the built app by `pnpm check:fuses` (scripts/check-fuses.ts).
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
mac:
  category: public.app-category.productivity
  hardenedRuntime: true
  target:
    - dmg
    - zip
win:
  target:
    - target: nsis
      arch:
        - x64
# Per user, without administrator rights, so that a person installs it without IT and the app
# updates itself without a prompt (docs/adr/0005, point 1).
nsis:
  oneClick: true
  perMachine: false
  artifactName: Lazurio-App-Setup-${version}.${ext}
# macOS and Windows show the product's name (Lazurio App.app, Lazurio App.exe); Linux uses a
# command-line name.
linux:
  executableName: lazurio-app
  target:
    - dir
publish:
  provider: github
  owner: Lazurio
  repo: lazurio-app
