# The update test from build N to N+1 on Windows (docs/adr/0005, point 9), and the trial builds a
# person tries by hand. Both builds come from the same commit, as 0.0.1 (N) and 0.0.2 (N+1), with
# their update feed baked in at packaging on the loopback (trial/electron-builder.trial.yml), where
# a local server serves N+1. Nothing is published: the builds are this run's artifacts.
name: Desktop update trial

on:
  pull_request:
    paths:
      - apps/desktop/**
      - helpers/**
      - packages/**
      - proto/**
      - scripts/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/desktop-update-trial.yml
      - .github/workflows/release*.yml
  workflow_dispatch:
  # The release workflow runs this test before every release (docs/adr/0005, point 9).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-update-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    env:
      # Unsigned until the signing identities exist; electron-builder must not pick a random one.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helpers/tailnet/go.mod
          cache-dependency-path: helpers/tailnet/go.sum
      - run: rustup toolchain install
        working-directory: helpers/device
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lazurio/app-desktop ensure:electron
      - run: pnpm --filter @lazurio/app-desktop build
      # Each trial build carries its own version in its helpers too (#22), checked through their Hello.
      - name: Package N and N+1
        shell: pwsh
        working-directory: apps/desktop
        run: |
          foreach ($version in '0.0.1', '0.0.2') {
            pnpm build:helpers --release --app-version $version
            if ($LASTEXITCODE -ne 0) { throw "Building the helpers of $version failed." }
            pnpm exec electron-builder --config trial/electron-builder.trial.yml `
              --win nsis --x64 --publish never `
              "-c.extraMetadata.version=$version" `
              "-c.directories.output=trial/out/$version" `
              "-c.nsis.differentialPackage=false"
            if ($LASTEXITCODE -ne 0) { throw "Packaging $version failed." }
            node scripts/check-helper-versions.ts "trial/out/$version/win-unpacked/resources/helpers" $version
            if ($LASTEXITCODE -ne 0) { throw "The helpers of $version name another version." }
          }
      # The trial builds are uploaded before the test, so a person can try them even when it fails.
      - name: Collect the trial builds
        shell: pwsh
        working-directory: apps/desktop/trial
        run: |
          New-Item -ItemType Directory -Force -Path out/artifact/n, out/artifact/n1 | Out-Null
          Copy-Item out/0.0.1/Lazurio-App-Setup-0.0.1.exe out/artifact/n/
          Copy-Item out/0.0.2/Lazurio-App-Setup-0.0.2.exe, out/0.0.2/latest.yml, serve-feed.ps1 out/artifact/n1/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lazurio-app-windows-trial
          path: apps/desktop/trial/out/artifact
          retention-days: 7
          if-no-files-found: error
      - name: Update from N to N+1
        shell: pwsh
        working-directory: apps/desktop/trial
        run: |
          ./update-trial.ps1 `
            -InstallerN (Get-Item out/0.0.1/Lazurio-App-Setup-0.0.1.exe).FullName `
            -Feed (Resolve-Path out/0.0.2).Path `
            -ExpectedVersion 0.0.2

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helpers/tailnet/go.mod
          cache-dependency-path: helpers/tailnet/go.sum
      - run: rustup toolchain install
        working-directory: helpers/device
      # AppImages mount through FUSE 2; Electron's sandbox needs unprivileged user namespaces; the
      # keystore check needs a Secret Service (gnome-keyring).
      - name: FUSE, Xvfb, a Secret Service and the operating system sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 xvfb gnome-keyring dbus-x11
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lazurio/app-desktop ensure:electron
      - run: pnpm --filter @lazurio/app-desktop build
      - name: Package N and N+1
        working-directory: apps/desktop
        run: |
          for version in 0.0.1 0.0.2; do
            pnpm build:helpers --release --app-version "$version"
            pnpm exec electron-builder --config trial/electron-builder.trial.yml \
              --linux AppImage --x64 --publish never \
              -c.extraMetadata.version="$version" \
              -c.directories.output="trial/out/$version" \
              -c.appImage.artifactName=Lazurio-App.AppImage
            node scripts/check-helper-versions.ts "trial/out/$version/linux-unpacked/resources/helpers" "$version"
          done
      # A session bus with an unlocked keyring; GNOME makes Electron's safeStorage use it, in N and
      # in the N+1 that the update starts.
      - name: Update from N to N+1
        working-directory: apps/desktop/trial
        run: |
          dbus-run-session -- bash -c '
            set -euo pipefail
            printf trial | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            export XDG_CURRENT_DESKTOP=GNOME
            ./update-trial.sh out/0.0.1/Lazurio-App.AppImage "$PWD/out/0.0.2"
          '

  # The Mac gets a trial build of N only: without a Developer ID, Squirrel.Mac never installs an
  # update (docs/adr/0005, point 7), so a person installs and starts it by hand.
  macos:
    runs-on: macos-15
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helpers/tailnet/go.mod
          cache-dependency-path: helpers/tailnet/go.sum
      - run: rustup toolchain install
        working-directory: helpers/device
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lazurio/app-desktop ensure:electron
      - run: pnpm build:helpers --release --app-version 0.0.1
      - run: pnpm --filter @lazurio/app-desktop build
      - name: Package N
        working-directory: apps/desktop
        env:
          # electron-builder skips signing on pull requests, even the ad hoc signature, which uses no
          # secret (trial/electron-builder.trial.yml); this job holds no signing secret.
          CSC_FOR_PULL_REQUEST: "true"
        run: |
          pnpm exec electron-builder --config trial/electron-builder.trial.yml \
            --mac zip --arm64 --publish never \
            -c.extraMetadata.version=0.0.1 \
            -c.directories.output=trial/out/0.0.1
      - name: Helper versions
        working-directory: apps/desktop
        run: node scripts/check-helper-versions.ts "trial/out/0.0.1/mac-arm64/Lazurio App.app/Contents/Resources/helpers" 0.0.1
      - name: Signature and launch
        working-directory: apps/desktop/trial
        run: ./launch-check-macos.sh "out/0.0.1/mac-arm64/Lazurio App.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lazurio-app-macos-trial
          path: apps/desktop/trial/out/0.0.1/*.zip
          retention-days: 7
          if-no-files-found: error
