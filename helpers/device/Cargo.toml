[package]
name = "lazurio-device"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Elastic-2.0"
publish = false
description = "The Device helper of Lazurio App: lets the agents of an Environment use this computer while its owner allows it."

[dependencies]
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", features = ["zeroize"] }
prost = "=0.14.4"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
serde_json = "=1.0.154"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
zeroize = "=1.8.2"

[target.'cfg(unix)'.dependencies]
# Ends the engine's process group (ADR 0006 point 8).
nix = { version = "=0.31.3", default-features = false, features = ["signal"] }

[target.'cfg(windows)'.dependencies]
# Ends the engine's job object (ADR 0006 point 8).
win32job = "=2.0.3"

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }

[build-dependencies]
prost-build = "=0.14.4"
protox = "=0.10.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
