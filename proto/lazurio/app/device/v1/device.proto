syntax = "proto3";

// The work of the Device helper: the channels through which the agents of a person's Environments
// use this computer while its owner allows it (decision 0248, ADR 0006). The messages travel in
// the envelope of lazurio.app.helper.v1 from field 20 on.
//
// The main process owns every switch and every secret. The helper opens a channel only on
// StartChannel, keeps its hand-over only in memory and only until it was sent once, writes only to
// the data directory it is given, and reports every change of state on its own.
package lazurio.app.device.v1;

option go_package = "github.com/Lazurio/lazurio-app/helpers/tailnet/gen/lazurio/app/device/v1;devicev1";

// Tells the helper where it keeps its files and how the computer is named. The first request of
// the device's work; until it, the helper answers every other request of this package with
// Failure "not_configured".
message ConfigureDevice {
  // A directory inside the app's userData, never next to the helper's binary: an update replaces
  // the whole package. The helper keeps there the history without content.
  string data_directory = 1;

  // The computer's name as the person sees it, for the Environment's list of computers.
  string computer_name = 2;
}

// The answer to ConfigureDevice.
message DeviceReady {
  // The version of the attach contract this helper speaks: 3, the hand-over of Lazurio Auth in the
  // upgrade and `ready` or `denied` of version 3. Helpers before it spoke 1.
  uint32 contract_version = 1;
}

// Opens the channel of one Environment with one hand-over (contract v3) and keeps it open until
// StopChannel, the end of its session or a refusal. The main process sends it only while the person
// has the Environment's switch on. The helper answers with the channel's state at once and sends
// every later change on its own.
//
// A hand-over opens one session at most: the helper never connects again by itself. When the
// session ends, or the attempt fails, the helper reports NeedsHandOver, and the channel opens again
// only with a new StartChannel carrying a new hand-over.
message StartChannel {
  // The app's id for the Environment. Unique among the channels.
  string environment_id = 1;

  // The Environment's name as the person sees it, for the indicator.
  string environment_label = 2;

  // The attach address, `wss://<the Environment's Lazurio host>/.lazurio/computers/attach`,
  // without credentials or query.
  string attach_url = 3;

  // Contract v1's device id and the Ed25519 seed of the Device's key, no longer served. They stay
  // here only because the protocol never deletes a field (buf breaking, FILE). The helper refuses a
  // StartChannel that carries either.
  string device_id = 4 [deprecated = true];
  bytes key_seed = 5 [deprecated = true];

  // Present when the app is a node of the Environment's tailnet: the tailnet helper's loopback
  // proxy and the credentials of its current start. Absent: the helper connects directly.
  TailnetProxy proxy = 6;

  // The one-time hand-over Lazurio Auth gave the app for this Environment
  // (`POST /realms/workspace/lazurio-agent-entry/device-hand-over`, HumanAndMachine-ai/Auth#108),
  // base64url, valid for 60 s and one use. The helper sends it once, as the header
  // `X-Lazurio-Device-Hand-Over` of the WebSocket upgrade, and drops it right after that attempt,
  // whatever its outcome. Secret: the helper reads it apart from the other requests into memory
  // that is wiped, and never writes, logs or reports it.
  bytes hand_over = 7;
}

// The tailnet helper's loopback proxy, as its ProxyEndpoint gave it to the main process.
message TailnetProxy {
  string host = 1;
  uint32 port = 2;
  string username = 3;
  string password = 4;
}

// Closes the channel of one Environment at once, with any agent's work on it. The helper answers
// with the channel's state, Off.
message StopChannel {
  string environment_id = 1;
}

// Stop: ends the work of the agent that holds the computer now, whatever its Environment. The
// channels stay open. The helper answers with the lock's state.
message StopAgent {}

// The updater's gate (ADR 0006, point 7). With hold set, the helper grants the hold only while no
// agent holds the computer, and while it is granted refuses every new tool call. With hold unset,
// the hold ends. The helper answers with the lock's state.
message HoldForUpdate {
  bool hold = 1;
}

// Asks for a page of the history, the newest first.
message ListHistory {
  // From HistoryPage.next_page_token; empty for the first page. The page holds the entries older
  // than the token, so entries recorded meanwhile never shift it.
  string page_token = 1;

  // At most this many entries; the helper caps it.
  uint32 limit = 2;
}

// The state of one Environment's channel.
message ChannelState {
  string environment_id = 1;

  oneof state {
    Off off = 2;
    Connecting connecting = 3;
    Connected connected = 4;
    Refused refused = 5;
    Working working = 6;
    NeedsHandOver needs_hand_over = 7;
  }
}

// No channel: never started, stopped, or the switch is off.
message Off {}

// Connecting with the hand-over of the last StartChannel.
message Connecting {
  // How many hand-overs of this Environment in a row ended without `ready` before this one; 0 after
  // a session that got `ready` and after StopChannel.
  uint32 failed_attempts = 1;
}

// The Environment accepted the computer; no agent works through this channel now.
message Connected {}

// The channel ended and does not open again until the next StartChannel, which the main process
// sends only after the person did something about the reason. The reason is a stable code:
//
// - "already-attached": the Environment kept answering that it serves another session of this
//   computer for longer than the helper waits for an earlier session of its own to end.
// - "contract_mismatch": the Environment answered in a way contract v3 does not know: another
//   version, another message or an unknown reason of `denied`.
// - "invalid_attach_url": the attach address is not one the helper connects to.
message Refused {
  string reason = 1;
}

// The channel ended and spent its hand-over; the helper never sends a hand-over twice. The main
// process asks Lazurio Auth for a new hand-over after retry_after_ms and sends it in a new
// StartChannel, while the person's switch stays on. The reason is a stable code:
//
// - "connection_failed": no `ready` came: no route or name, the tailnet proxy, TLS, a timeout, or
//   the connection closed before `ready`.
// - "upgrade_refused": the gateway or the Launchpad answered the upgrade with the HTTP status in
//   http_status, for example 401 or 403 when the gateway helper did not accept the computer or
//   the hand-over, or 503 when the Launchpad could not check the gateway's proof.
// - "already-attached": the Launchpad serves another session of this computer (`denied`), for
//   example its previous session, which ends after 45 s without a word.
// - "expired": the Launchpad ended the session or refused it because the gateway no longer
//   confirms it (`denied` with `expired`), for example after 8 h or a refused renewal.
// - "internal-error": the Launchpad failed to start the session (`denied`).
// - "session_ended": a session that got `ready` ended otherwise: the connection broke, the
//   Environment went silent for 45 s, or it closed the session.
message NeedsHandOver {
  string reason = 1;

  // How many hand-overs of this Environment in a row ended without `ready`, this one included; 0
  // when the session got `ready`.
  uint32 failed_attempts = 2;

  // How long to wait before the next hand-over: 1 s after a session that got `ready`, doubling with
  // each failed attempt up to 60 s.
  uint64 retry_after_ms = 3;

  // For "upgrade_refused": the HTTP status of the answer to the upgrade; 0 otherwise.
  uint32 http_status = 4;
}

// An agent of this Environment works on the computer.
message Working {
  // The tool's name, never its arguments.
  string tool = 1;

  // The application the tool works in, when the engine names one.
  string application = 2;
}

// Who holds the computer: one agent at a time on the whole computer.
message LockState {
  // True when no agent holds the computer.
  bool idle = 1;

  // The Environment that holds it, when one does.
  string holder_environment_id = 2;
  string holder_environment_label = 3;

  // Unix milliseconds since the holder holds the computer.
  uint64 since_unix_ms = 4;

  // True while the updater's hold is granted.
  bool update_hold = 5;

  // Strictly increasing per helper process, assigned under the lock when this snapshot is
  // taken; the helper sends the snapshots in that order. A consumer ignores a LockState whose
  // sequence is not greater than the last one it applied.
  uint64 sequence = 6;
}

// The device helper's last message after Shutdown or the end of its input, sent on its own once
// every channel and every engine's process tree has been ended. The helper exits after it.
message DeviceStopped {
  // True only if every engine's process tree was confirmed gone and the helper never had to
  // keep the computer because a tree could not be confirmed gone. The updater installs only
  // after a DeviceStopped with true (ADR 0006 point 7).
  bool all_engines_ended = 1;
}

// One entry of the history. It names what happened and never holds content: no screen, no text,
// no arguments.
message HistoryEntry {
  uint64 at_unix_ms = 1;
  string environment_id = 2;

  // For example "connected", "disconnected", "refused", "tool", "stopped".
  string kind = 3;

  // For kind "tool": the tool's name.
  string tool = 4;

  // The entry's place in the history: one more than the entry before it, never reused. A page
  // token is a sequence, so pages stay stable while new entries arrive.
  uint64 sequence = 5;
}

// A page of the history.
message HistoryPage {
  repeated HistoryEntry entries = 1;

  // Empty when there is no further page.
  string next_page_token = 2;
}
